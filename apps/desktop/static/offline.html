<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KeepX</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 500;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>KeepX is not reachable</h1>
      <p id="detail">Start the web app, then open KeepX again.</p>
    </main>
    <script>
      const origin = new URLSearchParams(location.search).get("origin");
      if (origin) {
        document.getElementById("detail").textContent =
          "Start the web app at " + origin + ", then open KeepX again. This window only loads that address.";
      }
    </script>
  </body>
</html>
